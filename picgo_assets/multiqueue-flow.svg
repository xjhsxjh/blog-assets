<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace" font-size="13">
  <rect width="880" height="460" rx="8" fill="#2d333b"/>

  <text x="440" y="28" text-anchor="middle" fill="#cdd9e5" font-size="16" font-weight="bold">RSS / RPS / RFS / XPS 流量分发全景</text>

  <!-- NIC + RSS -->
  <rect x="20" y="50" width="260" height="170" rx="6" fill="none" stroke="#388bfd" stroke-width="2"/>
  <text x="150" y="72" text-anchor="middle" fill="#388bfd" font-size="14" font-weight="bold">网卡（硬件）</text>

  <rect x="35" y="85" width="110" height="28" rx="3" fill="#2d333b" stroke="#3fb950" stroke-width="1.5"/>
  <text x="90" y="104" text-anchor="middle" fill="#3fb950" font-size="11">入站包</text>

  <rect x="35" y="125" width="230" height="35" rx="3" fill="#2d333b" stroke="#388bfd" stroke-width="1.5"/>
  <text x="150" y="140" text-anchor="middle" fill="#388bfd" font-size="11">RSS: Toeplitz(5-tuple) → 间接表</text>
  <text x="150" y="155" text-anchor="middle" fill="#adbac7" font-size="10">hash % N → Queue Index</text>

  <line x1="90" y1="113" x2="90" y2="125" stroke="#adbac7" stroke-width="1" marker-end="url(#arr)"/>

  <!-- RX Queues -->
  <rect x="45" y="175" width="50" height="25" rx="2" fill="#2d333b" stroke="#f0883e" stroke-width="1"/>
  <text x="70" y="192" text-anchor="middle" fill="#f0883e" font-size="10">RXQ0</text>

  <rect x="105" y="175" width="50" height="25" rx="2" fill="#2d333b" stroke="#f0883e" stroke-width="1"/>
  <text x="130" y="192" text-anchor="middle" fill="#f0883e" font-size="10">RXQ1</text>

  <rect x="165" y="175" width="50" height="25" rx="2" fill="#2d333b" stroke="#f0883e" stroke-width="1"/>
  <text x="190" y="192" text-anchor="middle" fill="#f0883e" font-size="10">RXQ2</text>

  <rect x="225" y="175" width="30" height="25" rx="2" fill="#2d333b" stroke="#f0883e" stroke-width="1"/>
  <text x="240" y="192" text-anchor="middle" fill="#f0883e" font-size="10">...</text>

  <line x1="150" y1="160" x2="70" y2="175" stroke="#adbac7" stroke-width="1"/>
  <line x1="150" y1="160" x2="130" y2="175" stroke="#adbac7" stroke-width="1"/>
  <line x1="150" y1="160" x2="190" y2="175" stroke="#adbac7" stroke-width="1"/>

  <!-- NAPI + RPS/RFS -->
  <rect x="300" y="50" width="280" height="170" rx="6" fill="none" stroke="#a371f7" stroke-width="2"/>
  <text x="440" y="72" text-anchor="middle" fill="#a371f7" font-size="14" font-weight="bold">软件分发层</text>

  <rect x="315" y="85" width="120" height="28" rx="3" fill="#2d333b" stroke="#f0883e" stroke-width="1.5"/>
  <text x="375" y="104" text-anchor="middle" fill="#f0883e" font-size="11">NAPI 轮询</text>

  <rect x="450" y="85" width="115" height="28" rx="3" fill="#2d333b" stroke="#adbac7" stroke-width="1"/>
  <text x="507" y="104" text-anchor="middle" fill="#adbac7" font-size="10">IRQ → CPU N</text>

  <line x1="260" y1="187" x2="315" y2="99" stroke="#adbac7" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="315" y="125" width="250" height="35" rx="3" fill="#2d333b" stroke="#a371f7" stroke-width="1.5"/>
  <text x="440" y="140" text-anchor="middle" fill="#a371f7" font-size="11">RPS: get_rps_cpu()</text>
  <text x="440" y="155" text-anchor="middle" fill="#adbac7" font-size="10">rps_map → 候选 CPU 哈希选择</text>

  <line x1="375" y1="113" x2="375" y2="125" stroke="#adbac7" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="315" y="170" width="250" height="35" rx="3" fill="#2d333b" stroke="#3fb950" stroke-width="1.5"/>
  <text x="440" y="185" text-anchor="middle" fill="#3fb950" font-size="11">RFS: rps_sock_flow_table 覆盖</text>
  <text x="440" y="200" text-anchor="middle" fill="#adbac7" font-size="10">应用在 CPU X？→ 优先送 CPU X</text>

  <line x1="440" y1="160" x2="440" y2="170" stroke="#adbac7" stroke-width="1" marker-end="url(#arr)"/>

  <!-- CPU processing -->
  <rect x="600" y="50" width="260" height="170" rx="6" fill="none" stroke="#3fb950" stroke-width="2"/>
  <text x="730" y="72" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">CPU 处理</text>

  <rect x="615" y="85" width="55" height="50" rx="3" fill="#2d333b" stroke="#cdd9e5" stroke-width="1"/>
  <text x="642" y="105" text-anchor="middle" fill="#cdd9e5" font-size="10">CPU 0</text>
  <text x="642" y="120" text-anchor="middle" fill="#3fb950" font-size="9">协议栈</text>

  <rect x="680" y="85" width="55" height="50" rx="3" fill="#2d333b" stroke="#cdd9e5" stroke-width="1"/>
  <text x="707" y="105" text-anchor="middle" fill="#cdd9e5" font-size="10">CPU 1</text>
  <text x="707" y="120" text-anchor="middle" fill="#3fb950" font-size="9">协议栈</text>

  <rect x="745" y="85" width="55" height="50" rx="3" fill="#2d333b" stroke="#cdd9e5" stroke-width="1"/>
  <text x="772" y="105" text-anchor="middle" fill="#cdd9e5" font-size="10">CPU 2</text>
  <text x="772" y="120" text-anchor="middle" fill="#3fb950" font-size="9">协议栈</text>

  <rect x="810" y="85" width="40" height="50" rx="3" fill="#2d333b" stroke="#cdd9e5" stroke-width="1"/>
  <text x="830" y="110" text-anchor="middle" fill="#cdd9e5" font-size="10">...</text>

  <line x1="565" y1="187" x2="615" y2="110" stroke="#a371f7" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="615" y="150" width="230" height="28" rx="3" fill="#2d333b" stroke="#f0883e" stroke-width="1.5"/>
  <text x="730" y="168" text-anchor="middle" fill="#f0883e" font-size="11">应用 recv() → rps_record_sock_flow()</text>

  <rect x="615" y="185" width="230" height="25" rx="3" fill="#2d333b" stroke="#adbac7" stroke-width="1"/>
  <text x="730" y="202" text-anchor="middle" fill="#adbac7" font-size="10">更新 RFS 流表：流 → 当前 CPU</text>

  <!-- TX path: XPS -->
  <rect x="20" y="245" width="540" height="95" rx="6" fill="none" stroke="#f0883e" stroke-width="2"/>
  <text x="290" y="267" text-anchor="middle" fill="#f0883e" font-size="14" font-weight="bold">发送路径 — XPS (Transmit Packet Steering)</text>

  <rect x="35" y="280" width="110" height="28" rx="3" fill="#2d333b" stroke="#3fb950" stroke-width="1.5"/>
  <text x="90" y="299" text-anchor="middle" fill="#3fb950" font-size="11">应用 send()</text>

  <rect x="165" y="280" width="160" height="28" rx="3" fill="#2d333b" stroke="#f0883e" stroke-width="1.5"/>
  <text x="245" y="299" text-anchor="middle" fill="#f0883e" font-size="11">netdev_pick_tx()</text>

  <rect x="345" y="280" width="200" height="28" rx="3" fill="#2d333b" stroke="#a371f7" stroke-width="1.5"/>
  <text x="445" y="295" text-anchor="middle" fill="#a371f7" font-size="11">XPS: xps_maps[cpu] → TXQ N</text>

  <line x1="145" y1="294" x2="165" y2="294" stroke="#adbac7" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="325" y1="294" x2="345" y2="294" stroke="#adbac7" stroke-width="1" marker-end="url(#arr)"/>

  <text x="35" y="328" fill="#adbac7" font-size="10">CPU 模式: CPU N → TXQ N（减少锁竞争）  |  RXQ 模式: RXQ N → TXQ N（请求/应答对齐）</text>

  <!-- aRFS -->
  <rect x="580" y="245" width="280" height="95" rx="6" fill="none" stroke="#f85149" stroke-width="2"/>
  <text x="720" y="267" text-anchor="middle" fill="#f85149" font-size="14" font-weight="bold">aRFS（硬件加速）</text>

  <text x="595" y="290" fill="#adbac7" font-size="11">ndo_rx_flow_steer(dev, skb,</text>
  <text x="595" y="306" fill="#adbac7" font-size="11">    rxq_index, flow_id)</text>
  <text x="595" y="326" fill="#f85149" font-size="10">→ NIC Flow Director 硬件规则</text>
  <text x="595" y="340" fill="#3fb950" font-size="10">五元组精确匹配，零 IPI 开销</text>

  <!-- Summary -->
  <rect x="20" y="365" width="840" height="80" rx="6" fill="none" stroke="#cdd9e5" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="440" y="387" text-anchor="middle" fill="#cdd9e5" font-size="13" font-weight="bold">机制总结</text>

  <text x="35" y="410" fill="#388bfd" font-size="11">RSS（硬件）：NIC Toeplitz 哈希 → RXQ</text>
  <text x="35" y="430" fill="#a371f7" font-size="11">RPS（软件）：get_rps_cpu() → IPI → 目标 CPU</text>

  <text x="330" y="410" fill="#3fb950" font-size="11">RFS：应用 CPU → 覆盖 RPS 选择</text>
  <text x="330" y="430" fill="#f0883e" font-size="11">XPS：CPU/RXQ → TXQ 亲和映射</text>

  <text x="620" y="410" fill="#f85149" font-size="11">aRFS：Flow Director 硬件规则</text>
  <text x="620" y="430" fill="#cdd9e5" font-size="11">= RSS + RFS 下沉到网卡</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#adbac7" stroke-width="1"/>
    </marker>
  </defs>
</svg>
